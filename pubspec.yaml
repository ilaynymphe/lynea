name: novelia
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  csv: ^6.0.0
  share_plus: ^10.1.2
  table_calendar: ^3.1.2
  geolocator: ^13.0.1
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  background_color: "#FFF8F5"
  theme_color: "#B185A7"

flutter_native_splash:
  color: "#FFF8F5"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#FFF8F5"